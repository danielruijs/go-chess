name: Backend

on:
  push:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: cd backend && go mod download

      - name: Build
        run: cd backend && go build -v ./...

      - name: Go vet
        run: cd backend && go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: cd backend && go mod download

      - name: Test
        run: cd backend && go test -v ./...

  deploy:
    name: Deploy to self-hosted server
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build stack
        run: docker compose -f docker-compose.yml build

      - name: Pre-deployment database backup
        run: |
          mkdir -p ~/db_backups
          if [ "$(docker compose -f docker-compose.yml ps -q postgres)" ]; then
            docker compose -f docker-compose.yml exec -T postgres pg_dump -U gochess gochess > ~/db_backups/gochess_pre_deploy_backup.sql
          fi

      - name: Run database migrations
        run: docker compose -f docker-compose.yml run --rm migrate

      - name: Start backend
        run: docker compose -f docker-compose.yml up -d backend

      - name: Cleanup old Docker data
        if: always() # This ensures it runs even if the build fails
        run: docker system prune -f
