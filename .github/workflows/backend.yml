name: Backend

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Go
              uses: actions/setup-go@v6
              with:
                go-version: '1.26'

            - name: Install dependencies
              run: cd backend && go mod download

            - name: Go vet
              run: cd backend && go vet ./...

            - name: Lint
              uses: golangci/golangci-lint-action@v9
              with:
                version: latest
                working-directory: backend

    test:
      name: Test
      runs-on: ubuntu-latest

      steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Setup Go
            uses: actions/setup-go@v6
            with:
              go-version: '1.26'

          - name: Install dependencies
            run: cd backend && go mod download

          - name: Test
            run: cd backend && go test -v ./...