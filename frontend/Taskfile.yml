version: "3"

tasks:
  deps:
    desc: "Download npm dependencies"
    cmds:
      - npm install

  build:
    desc: "Build the frontend"
    cmds:
      - npm run build

  test:
    desc: "Run tests"
    cmds:
      - npm test

  lint:
    desc: "Run linter"
    cmds:
      - npm run lint

  format:
    desc: "Check code formatting"
    cmds:
      - npm run format:check

  ci:
    desc: "Run full frontend ci"
    deps: [deps, build, test, lint, format]

  run:
    desc: "Run the frontend"
    cmds:
      - npm install
      - npm run dev
